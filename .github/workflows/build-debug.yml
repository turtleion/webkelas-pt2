name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Decode debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystores
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > android/keystores/debug.keystore

      - name: Write .env.local
        env:
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
        run: echo "VITE_GOOGLE_WEB_CLIENT_ID=$VITE_GOOGLE_WEB_CLIENT_ID" > .env.local

      - name: Build web
        run: pnpm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          NAME="arsip-kelas-debug-$(git rev-parse --short HEAD).apk"
          mv "$APK" "$NAME"
          echo "APK_NAME=$NAME" >> $GITHUB_ENV

      - name: Upload to GitHub Release (debug)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "Arsip Kelas Debug Build"
          draft: false
          prerelease: true
          files: ${{ env.APK_NAME }}