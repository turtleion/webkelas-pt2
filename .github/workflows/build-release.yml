name: Build & Release Prototype

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install pnpm
        run: npm i -g pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: '35.0.0'
          ndk: '25.2.9519653'
          cache: true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Gradle clean & build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Compute build metadata
        id: meta
        run: |
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "DATE=$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          NEW_NAME="PROTOTYPE_TEST-${{ steps.meta.outputs.BUILD_NUMBER }}-${{ steps.meta.outputs.COMMIT_HASH }}(${{ steps.meta.outputs.DATE }}).apk"
          mv ${{ steps.meta.outputs.APK_PATH }} ${{ steps.meta.outputs.APK_PATH%/* }}/$NEW_NAME
          echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV

      - name: Create draft release & upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prototype-${{ steps.meta.outputs.COMMIT_HASH }}
          name: Prototype Build ${{ steps.meta.outputs.BUILD_NUMBER }}
          draft: true
          prerelease: true
          files: android/app/build/outputs/apk/debug/${{ env.APK_NAME }}
